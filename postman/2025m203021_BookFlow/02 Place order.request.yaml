$kind: http-request
url: "{{orders}}/orders"
method: POST
headers:
  Content-Type: application/json
  Idempotency-Key: "{{orderKey}}"
body:
  type: json
  content: |-
    {
      "customer": "Vattikunta Vishnu Priya",
      "sku": "BOOK-001",
      "quantity": 2
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set("orderKey", "postman-" + pm.variables.replaceIn("{{$guid}}"));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", () => pm.response.to.have.status(201));
      pm.collectionVariables.set("orderId", pm.response.json().id);
      pm.test("Confirmed", () => pm.expect(pm.response.json().status).to.eql("CONFIRMED"));
    language: text/javascript
order: 2000
