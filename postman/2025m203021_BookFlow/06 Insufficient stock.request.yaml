$kind: http-request
url: "{{orders}}/orders"
method: POST
headers:
  Content-Type: application/json
  Idempotency-Key: "{{orderKey}}-reject"
body:
  type: json
  content: |-
    {
      "customer": "Vattikunta Vishnu Priya",
      "sku": "BOOK-001",
      "quantity": 1000
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", () => pm.response.to.have.status(201));
      pm.test("Rejected", () => pm.expect(pm.response.json().status).to.eql("REJECTED"));
    language: text/javascript
order: 6000
