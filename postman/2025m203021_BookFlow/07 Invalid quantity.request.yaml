$kind: http-request
url: "{{orders}}/orders"
method: POST
headers:
  Content-Type: application/json
  Idempotency-Key: "{{orderKey}}-bad"
body:
  type: json
  content: |-
    {
      "customer": "Vattikunta Vishnu Priya",
      "sku": "BOOK-001",
      "quantity": 0
    }
scripts:
  - type: afterResponse
    code: pm.test("HTTP 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 7000
