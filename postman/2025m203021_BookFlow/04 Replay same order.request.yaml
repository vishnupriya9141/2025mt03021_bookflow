$kind: http-request
url: "{{orders}}/orders"
method: POST
headers:
  Content-Type: application/json
  Idempotency-Key: "{{orderKey}}"
body:
  type: json
  content: |-
    {
      "customer": "Vattikunta Vishnu Priya",
      "sku": "BOOK-001",
      "quantity": 2
    }
scripts:
  - type: afterResponse
    code: pm.test("HTTP 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
