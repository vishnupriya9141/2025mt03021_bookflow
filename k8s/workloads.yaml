{
  "apiVersion": "v1",
  "kind": "PersistentVolumeClaim",
  "metadata": {
    "name": "inventory-data",
    "namespace": "bookflow"
  },
  "spec": {
    "accessModes": [
      "ReadWriteOnce"
    ],
    "resources": {
      "requests": {
        "storage": "1Gi"
      }
    }
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "inventory",
    "namespace": "bookflow"
  },
  "spec": {
    "replicas": 1,
    "strategy": {
      "type": "Recreate"
    },
    "selector": {
      "matchLabels": {
        "app": "inventory"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "inventory"
        }
      },
      "spec": {
        "securityContext": {
          "runAsNonRoot": true,
          "runAsUser": 10001,
          "runAsGroup": 10001,
          "fsGroup": 10001
        },
        "terminationGracePeriodSeconds": 15,
        "containers": [
          {
            "name": "inventory",
            "image": "bookflow-inventory:1.0",
            "imagePullPolicy": "IfNotPresent",
            "ports": [
              {
                "containerPort": 8000
              }
            ],
            "env": [
              {
                "name": "SERVICE_TOKEN",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "service-auth",
                    "key": "token"
                  }
                }
              }
            ],
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "64Mi"
              },
              "limits": {
                "cpu": "500m",
                "memory": "256Mi"
              }
            },
            "startupProbe": {
              "httpGet": {
                "path": "/health/ready",
                "port": 8000
              },
              "periodSeconds": 5,
              "timeoutSeconds": 2,
              "failureThreshold": 6
            },
            "readinessProbe": {
              "httpGet": {
                "path": "/health/ready",
                "port": 8000
              },
              "periodSeconds": 5,
              "timeoutSeconds": 2,
              "failureThreshold": 6
            },
            "livenessProbe": {
              "httpGet": {
                "path": "/health/live",
                "port": 8000
              },
              "periodSeconds": 5,
              "timeoutSeconds": 2,
              "failureThreshold": 6
            },
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "readOnlyRootFilesystem": true,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "volumeMounts": [
              {
                "name": "data",
                "mountPath": "/data"
              }
            ]
          }
        ],
        "volumes": [
          {
            "name": "data",
            "persistentVolumeClaim": {
              "claimName": "inventory-data"
            }
          }
        ]
      }
    }
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "inventory",
    "namespace": "bookflow"
  },
  "spec": {
    "type": "ClusterIP",
    "selector": {
      "app": "inventory"
    },
    "ports": [
      {
        "port": 8000,
        "targetPort": 8000
      }
    ]
  }
}
---
{
